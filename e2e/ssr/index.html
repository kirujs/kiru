<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {{kiru_head}}
  </head>
  <body>
    <div id="app">{{kiru_body}}</div>
    <!--
      `async` is required for streaming SSR: `<script type="module">` is
      implicitly deferred to `DOMContentLoaded`, which doesn't fire until
      the streamed response closes. The renderer logs a warning at startup
      if this attribute is missing.
    -->
    <script type="module" async src="/src/client.tsx"></script>
  </body>
</html>
